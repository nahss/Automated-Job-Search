name: Daily Job & Lead Agent

on:
  schedule:
    # 04:32 UTC == 05:32 Africa/Lagos (UTC+1).
    # NOTE: GitHub's scheduled cron is BEST-EFFORT, not guaranteed on time.
    # Runs can be delayed minutes-to-hours (or rarely skipped) under load,
    # and minute :00 is the most congested slot -- so we deliberately avoid
    # it (minute 32) and run a little early, so a typical delay still lands
    # in the morning. Change the time below (it is in UTC) to shift it.
    - cron: "32 4 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button

concurrency:
  # Never let two runs write the sheet at once.
  group: job-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
        run: python -m src.main
